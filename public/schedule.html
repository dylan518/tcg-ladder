<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament schedule</title>
<style>
  :root { --ink: #1d2330; --muted: #6b7384; --line: #e6e9ee; --bg: #f6f7f9; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 28px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { padding: 3px 0; }
  .checks .ok::before { content: "PASS"; color: #2e7d32; font-weight: 700; margin-right: 8px; }
  .checks .bad::before { content: "FAIL"; color: #b3261e; font-weight: 700; margin-right: 8px; }
  .checks .bad { color: #b3261e; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 10px 0 0; color: var(--muted); font-size: .85rem; }
  .wrap { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; background: #fff; }
  th, td { border-bottom: 1px solid var(--line); padding: 3px 4px; text-align: center; white-space: nowrap; }
  th { position: sticky; top: 0; background: #fff; z-index: 1; font-size: .8rem; color: var(--muted); font-weight: 600; }
  td.rn { color: var(--muted); font-variant-numeric: tabular-nums; width: 36px; }
  td.goal { width: 130px; text-align: left; }
  .goal svg { vertical-align: middle; margin-right: 6px; }
  .goal small { color: var(--muted); }
  .cell { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 58px; padding: 3px 6px; border-radius: 5px; font-size: .78rem; font-weight: 600; }
  .cell.S { color: #fff; }
  .cell.R { background: #fff; border: 2px solid; }
  tr.swap td { background: #fff7e0; color: #7a5a00; font-weight: 600; text-align: left; padding: 8px 10px; }
  tr.phase td { background: #eef2f6; color: #3a4252; font-weight: 700; text-align: left; padding: 6px 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
  .pairs td, .pairs th { text-align: left; padding: 4px 8px; }
  .sep { display: inline-block; min-width: 22px; text-align: center; border-radius: 10px; padding: 0 6px; font-size: .8rem; font-weight: 700; background: #eceef1; }
  .sep.s1 { background: #fde2c4; } .sep.s2 { background: #e6f0d2; } .sep.s3 { background: #d5e8f4; } .sep.s4 { background: #e4dcf3; } .sep.none { background: #f1f1f1; color: #8a93a3; }
  .err { color: #b3261e; white-space: pre-wrap; }
  .filters { margin: 10px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: .85rem; }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  td.dim { opacity: .15; }
</style>
</head>
<body>
<main>
  <h1>Tournament schedule</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="card"><ul class="checks" id="checks"></ul>
    <div class="legend">
      <span><b class="cell S" style="background:#8a93a3;min-width:0">S→P2</b> sends to P2</span>
      <span><b class="cell R" style="border-color:#8a93a3;color:#8a93a3;min-width:0">R←P1</b> receives from P1</span>
      <span>Colour = the pair that phase.</span>
      <span>Degree of separation: <span class="sep s1">1</span> played together before · <span class="sep s2">2</span> partner's partner · <span class="sep s3">3</span> · <span class="sep none">none</span> not connected</span>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <h2>Pairs per phase</h2>
  <div class="grid2" id="pairs"></div>

  <h2>Round by round</h2>
  <div class="wrap card" style="padding:0"><table id="grid"></table></div>
  <p class="err" id="err"></p>
</main>
<script>
const qs = new URLSearchParams(location.search);
const key = qs.get('key') || prompt('Admin key:');
const PAL = ['#d9534f', '#3171a6', '#3aa655', '#8e5bb5', '#e08a1e', '#16a2a2', '#c2477f', '#6d7a2a', '#5a6cd6', '#a0522d'];
const ANG = { up: 0, 'up-right': 45, right: 90, 'down-right': 135, down: 180, 'down-left': 225, left: 270, 'up-left': 315 };
const $ = (s) => document.querySelector(s);
let plan, P, focus = null;
const sepBadge = (v) => v === null || v === undefined ? '<span class="sep none">none</span>' : `<span class="sep s${Math.min(v, 4)}">${v}</span>`;

function goalSvg(g) {
  const C = 9, G = 2, cx = (g.x + 1) * (C + G) + C / 2, cy = (1 - g.y) * (C + G) + C / 2;
  let s = '';
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) s += `<rect x="${i * (C + G)}" y="${j * (C + G)}" width="${C}" height="${C}" fill="#fff" stroke="#a8c3df" stroke-width=".8"/>`;
  s += `<g transform="translate(${cx} ${cy}) rotate(${ANG[g.direction]})"><polygon points="0,-4 3.5,2.5 -3.5,2.5" fill="#df8133"/><circle cx="0" cy="-4" r="1.3" fill="#fff" stroke="#df8133" stroke-width=".6"/></g>`;
  return `<svg width="33" height="33" viewBox="-1 -1 33 33">${s}</svg>`;
}

function pairsView() {
  const phases = [...new Set(plan.schedule.map((r) => r.phase))];
  $('#pairs').innerHTML = phases.map((ph) => {
    const rd = plan.schedule.find((r) => r.phase === ph);
    const first = plan.schedule.filter((r) => r.phase === ph);
    return `<div class="card"><b>Phase ${ph}</b> · rounds ${first[0].round}–${first[first.length - 1].round}
      <table class="pairs"><tr><th>Pair</th><th>Players</th>${ph > 1 ? '<th>Degree of separation</th>' : ''}</tr>
      ${Object.entries(rd.groups).map(([g, x], i) => `<tr><td><span class="cell S" style="background:${PAL[i % PAL.length]};min-width:0">${g.replace('pair', '')}</span></td><td>${x.members.join(' & ')}</td>${ph > 1 ? `<td>${sepBadge(x.separation)}</td>` : ''}</tr>`).join('')}${rd.sitout ? `<tr><td></td><td style="color:#8a93a3">${rd.sitout} sits out</td>${ph > 1 ? '<td></td>' : ''}</tr>` : ''}
      </table></div>`;
  }).join('');
}

function render() {
  const rows = [`<tr><th>Rd</th><th style="text-align:left">Goal</th>${P.map((p) => `<th>${p}</th>`).join('')}</tr>`];
  let lastPhase = 0;
  for (const rd of plan.schedule) {
    if (rd.messageBefore) rows.push(`<tr class="swap"><td colspan="${P.length + 2}">Everyone sees: “${rd.messageBefore}”</td></tr>`);
    if (rd.phase !== lastPhase) { lastPhase = rd.phase; rows.push(`<tr class="phase"><td colspan="${P.length + 2}">Phase ${rd.phase}</td></tr>`); }
    const goal = plan.goals[rd.round - 1];
    const entries = Object.entries(rd.groups);
    const cells = P.map((p) => {
      const i = entries.findIndex(([, x]) => x.sender === p || x.receiver === p);
      if (i < 0) return rd.sitout === p ? '<td><span style="color:#8a93a3;font-size:.8rem">sits out</span></td>' : '<td>—</td>';
      const x = entries[i][1], col = PAL[i % PAL.length];
      const html = x.sender === p ? `<span class="cell S" style="background:${col}">S→${x.receiver}</span>` : `<span class="cell R" style="border-color:${col};color:${col}">R←${x.sender}</span>`;
      const dim = focus && p !== focus && x.sender !== focus && x.receiver !== focus ? ' dim' : '';
      return `<td class="${dim}">${html}</td>`;
    });
    rows.push(`<tr><td class="rn">${rd.round}</td><td class="goal">${goalSvg(goal)}<small>${goal.tile} · ${goal.direction}</small></td>${cells.join('')}</tr>`);
  }
  $('#grid').innerHTML = rows.join('');
}

function filters() {
  $('#filters').innerHTML = '<span style="color:var(--muted);font-size:.85rem;align-self:center">Highlight a player:</span>' +
    ['all', ...P].map((p) => `<button data-p="${p}" class="${(p === 'all' && !focus) || p === focus ? 'on' : ''}">${p}</button>`).join('');
  $('#filters').querySelectorAll('button').forEach((b) => b.onclick = () => { focus = b.dataset.p === 'all' ? null : b.dataset.p; filters(); render(); });
}

(async () => {
  try {
    let cfg = { mode: 'tournament' }, source = '';
    if (qs.get('seed')) { cfg.seed = qs.get('seed'); cfg.players = qs.get('players') || 8; source = 'preview of the settings on the dashboard'; }
    else {
      const st = await (await fetch(`/api/status?key=${encodeURIComponent(key)}`)).json();
      if (st.tournament && st.session?.design === 'tournament') { cfg.seed = st.seed; cfg.players = st.players.length; source = `the active session ${st.session.id}`; }
      else source = 'default settings (no tournament session is active)';
    }
    const r = await fetch(`/api/tournament/dryrun?key=${encodeURIComponent(key)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
    plan = await r.json();
    if (!r.ok) throw new Error(plan.error || r.status);
    P = plan.players;
    $('#sub').textContent = `${plan.schedule.length} rounds · ${P.length} players · seed ${plan.seed} · from ${source} (the server's own dry run)`;
    $('#checks').innerHTML = plan.checks.map((c) => `<li class="${c.ok ? 'ok' : 'bad'}">${c.name}${c.ok ? '' : '<br>' + c.problems.join('<br>')}</li>`).join('');
    filters(); pairsView(); render();
  } catch (e) { $('#err').textContent = 'Could not load the schedule: ' + e.message; }
})();
</script>
</body>
</html>
